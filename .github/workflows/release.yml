name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # TODO: swap in the exact runner label used in your
          # tailscale-container / tvheadend-containers workflows for the
          # native RISE Project riscv64 runner — copy it verbatim from
          # there rather than relying on this placeholder.
          - arch: riscv64
            target: riscv64gc-unknown-linux-gnu
            runner: [self-hosted, riscv64]

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/archive-drive dist/archive-drive
          tar -czf archive-drive-${{ matrix.arch }}.tar.gz -C dist archive-drive

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-drive-${{ matrix.arch }}
          path: archive-drive-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
